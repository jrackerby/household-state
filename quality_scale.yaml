# https://developers.home-assistant.io/docs/core/integration-quality-scale/
#
# TARGET: SILVER. The quality scale is the build standard for every
# custom_components/* repo — Bronze the floor for anything shipped, Silver the
# target for anything reading a device, a service, or another integration's
# entities. This integration reads other integrations' entities as its ENTIRE
# input, so Silver is the target and every Bronze and Silver rule below carries
# a verdict.
#
# NOTHING VALIDATES THIS FILE FOR A CUSTOM COMPONENT. hassfest's
# validate_iqs_file opens with `if not integration.core: return`, so it is never
# read here, while manifest.json's schema still accepts a `quality_scale` key —
# a tier declared there would be a self-claim with no gate behind it. Two
# consequences, both deliberate:
#
#   1. manifest.json declares NO quality_scale key, and must not until the
#      Bronze todos below are closed. Bronze is not met today.
#   2. tests/test_quality_scale.py is this file's gate: it asserts every rule is
#      present exactly once, that each status is one hassfest accepts, and that
#      every `exempt` carries the reason the schema requires. A gap-list nobody
#      validates goes stale the first time a rule is added (make the
#      gate impossible to skip).
#
# A DEVIATION IS A RULING WITH A CITATION, never a silent exception.
# The two below — entity-unavailable and test-before-setup — are both the same
# never-raise contract, stated in const.py's RULE 1.

rules:
  # ------------------------------------------------------------------ Bronze
  action-setup:
    status: exempt
    comment: >-
      Registers no actions. This integration writes nothing and calls no
      service — it resolves state from other integrations' entities and
      publishes it. `hass.services.has_service` is READ once, to score the
      operator notify path as a source; nothing is registered.
  appropriate-polling:
    status: done
    comment: >-
      DataUpdateCoordinator with update_interval from the entry's
      `scan_interval` option, DEFAULT_SCAN_INTERVAL=3s, bounded 1-300 by the
      options flow. Every source read is a state-machine read with no IO, so
      the interval is set by the display requirement, not by a remote service;
      pinned it at 3s to keep STAGE rise and fall latency under ten seconds on
      a tablet rendering the household's instruction row.
  brands:
    status: todo
    comment: >-
      BLOCKED ON #1, not on work in this repo. Assets now ship in-repo
      (brand/icon.png 256, icon@2x.png 512, logo.png), which is what makes HA
      render an icon for a custom integration — the practical effect the rule
      exists to produce. The rule itself asks for an entry in
      home-assistant/brands, and that is measurably absent: both
      core_integrations/household_state and custom_integrations/household_state
      are 404 (checked 2026-09-11). A submission needs this repo public, which
      is #1. Status stays todo rather than done because the registry entry is
      the rule and it does not exist; the HACS brands check stays ignored in
      validate.yml for the same reason — it cannot pass for an unsubmitted
      domain, so un-ignoring it would only turn CI red.
  common-modules: done
  config-flow: done
  config-flow-test-coverage:
    status: done
    comment: >-
      config_flow.py at 100% (measured, `pytest --cov=household_state`).
      tests/test_config_flow.py drives the single-instance abort, the empty
      user schema, the options default read back off the entry, the inclusive
      1-300 bound and the string coercion, and separately ties the
      `single_instance_allowed` abort reason to translations/en.json — a
      reason with no string behind it renders as a raw key and the flow
      returns the key either way. It runs against tests/ha_stubs' flow bases,
      so it proves this repo's flow logic and nothing about core's flow
      manager; that trade is ha_stubs' standing one and is stated in both
      files.
  dependency-transparency:
    status: done
    comment: >-
      `requirements` is empty and the component imports nothing outside
      Home Assistant and the standard library. There is no dependency to be
      transparent about.
  docs-actions:
    status: exempt
    comment: Registers no actions, so there are none to document.
  docs-conditions:
    status: exempt
    comment: Registers no conditions.
  docs-high-level-description:
    status: done
    comment: >-
      README opens with what the integration resolves and what it deliberately
      does not do. A custom integration has no home-assistant.io page; the
      README is the documentation, as it is across this estate's component
      repos.
  docs-installation-instructions:
    status: done
    comment: >-
      README "Install" carries the HACS custom-repository route and the
      content_in_root layout note that makes it work.
  docs-removal-instructions:
    status: done
    comment: >-
      README "Remove" covers deleting the entry and the HACS repository, and
      carries the trap that actually bites: HA never reclaims an entity id, so
      a reinstall lands `_2` suffixes while every dashboard and automation
      keeps pointing at ids that now belong to nothing. This integration
      already carries one live scar of exactly that. Also states what
      is NOT left behind, since it writes nothing outside its own ledger.
  docs-triggers:
    status: exempt
    comment: Registers no triggers.
  entity-event-setup:
    status: exempt
    comment: >-
      Every entity is a CoordinatorEntity and subscribes to nothing of its own.
      The one lifecycle subscription is the coordinator's logging arm in
      __init__.py, registered via async_at_started and torn down through
      entry.async_on_unload.
  entity-unique-id:
    status: done
    comment: >-
      Every entity sets _attr_unique_id from the entry_id plus a stable
      per-entity suffix; source sensors use the SOURCES row's `key`, which
      tests/test_sources_unique.py asserts is unique.
  has-entity-name:
    status: done
    comment: >-
      Set once on the shared HouseholdStateEntity base, so ids slug from the
      device name — sensor.household_state_stage, not
      sensor.household_state_stage_stage.
  runtime-data:
    status: done
    comment: >-
      The coordinator is assigned to entry.runtime_data and read back off the
      entry in both platforms; hass.data is gone from shipped code entirely.
      coordinator.py carries the typed alias
      HouseholdStateConfigEntry = ConfigEntry[HouseholdStateCoordinator].
      Plain assignment rather than a PEP 695 `type` statement, so the alias
      evaluates on the interpreter the suite runs on as well as the one HA
      requires — the rule is about where runtime data lives, not which alias
      syntax declares it.
  test-before-configure:
    status: exempt
    comment: >-
      The user step takes no input — there is no host, credential or endpoint
      to test. The integration's inputs are other integrations' entities, which
      may legitimately not exist yet at configure time, and a source that
      cannot be read is this integration's OUTPUT (published as `absent` /
      `unknown` on the entity attributes), never a setup failure. Refusing the
      entry over one would be the dead-feed-reads-green collapse the component exists to
      refuse.
  test-before-setup:
    status: exempt
    comment: >-
      DEVIATION, and a deliberate one. The coordinator NEVER
      raises UpdateFailed, so async_config_entry_first_refresh has no failure
      path to convert into ConfigEntryNotReady, and every entity overrides
      `available` to True. That is deliberate: a monitor that disappears with
      its subject cannot report the subject down. The quality scale's own
      example raises on an unreachable device or service; a coordinator reading
      other entities has no service to lose, so the rule does not govern here
      (apply a rule where it governs, not where it merely sounds
      relevant).
  unique-config-entry:
    status: done
    comment: >-
      manifest declares single_config_entry, and the flow aborts on
      `single_instance_allowed` via _async_current_entries. There is one
      household.

  # ------------------------------------------------------------------ Silver
  action-exceptions:
    status: exempt
    comment: Registers no actions.
  config-entry-unloading:
    status: done
    comment: >-
      async_unload_entry unloads both platforms and drops the coordinator; the
      options-update listener and the async_at_started logging arm are both
      registered through entry.async_on_unload.
  docs-configuration-parameters:
    status: done
    comment: >-
      README "Configuration" tables the one option with its default and range,
      says why 3s is deliberate rather than arbitrary (every poll is a
      state-machine read with no IO, so the interval is set by what a wall
      display needs), and warns against raising it past the fall dwell, which
      would make the dwell meaningless.
  docs-installation-parameters:
    status: exempt
    comment: >-
      The user step's schema is empty. There are no installation parameters to
      document; the one runtime option is covered by
      docs-configuration-parameters above.
  entity-unavailable:
    status: exempt
    comment: >-
      DEVIATION, and a deliberate one. Every entity overrides `available` to True and an unreadable
      source surfaces as state `unknown` with a `disposition` attribute, never
      as the entity going away. Attributes on an unavailable entity vanish,
      which is precisely how a broken collector reads green — the defect this
      integration was built to make visible. The rule's OTHER half does govern
      and was adopted; see log-when-unavailable.
  integration-owner:
    status: done
    comment: manifest `codeowners` is @jrackerby.
  log-when-unavailable:
    status: done
    comment: >-
      The half of the rule that governs here. A source that
      cannot be read logs once at the crossing and once on recovery, at INFO —
      it is the integration reporting its own subject, not an integration
      error. Deduped on a stable CONDITION token, never on the message: the
      perimeter sentence carries a count, so message-deduping re-fired on every
      membership change while the condition never moved. Logging is gated on HA
      reaching RUNNING and records nothing while silent, or a fault present
      through startup would read as already-reported and never log. Config
      defects that need a human edit (a missing entity, an unresolvable label,
      an unparseable attribute) stay WARNING.
  parallel-updates:
    status: done
    comment: >-
      PARALLEL_UPDATES = 0 declared in both platforms. Every entity is
      coordinator-driven and read-only, so there is no per-entity update to
      serialise and no device to overwhelm — the rule is about saying which it
      is rather than leaving it to the default.
  reauthentication-flow:
    status: exempt
    comment: >-
      No credentials. The integration authenticates to nothing; it reads the
      local state machine.
  test-coverage:
    status: done
    comment: >-
      99% across the package, measured, up from 49% when this repo was
      gap-listed (__init__, binary_sensor, config_flow, const, entity and
      sensor at 100%, coordinator 99%, resolver 95%). The rule wants above 95%
      and validate.yml now FAILS below it — a self-reported coverage figure
      drifts the moment code lands faster than tests do, which is how the repo
      reached 49% without anyone noticing. The suite runs against
      tests/ha_stubs rather than a real core install, deliberately: it proves
      this repo's own policy, not core's registry semantics, and both
      _perimeter_entity_ids and the config-entry read keep their RULE 1 guards
      precisely because no test here can see a core API move.

  # -------------------------------------------------------------------- Gold
  # Not the target. Listed so the file stays complete when the target moves,
  # and so a rule already satisfied is not re-derived from nothing later.
  devices:
    status: done
    comment: >-
      One device for the whole layer, defined once in entity.py, identified by
      the entry_id.
  diagnostics: todo
  discovery:
    status: exempt
    comment: >-
      Nothing to discover. The integration reads entities that are already in
      the registry; it has no network presence.
  discovery-update-info:
    status: exempt
    comment: No discovery, and no host or address to keep up to date.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices:
    status: exempt
    comment: Supports no devices. Its inputs are other integrations' entities.
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: >-
      The device set is fixed at one. Sources are rows in const.py's SOURCES,
      not discovered devices.
  entity-category:
    status: done
    comment: >-
      The per-source sensors are EntityCategory.DIAGNOSTIC; the three axis
      sensors and the two binary sensors are primary state and correctly carry
      none.
  entity-device-class:
    status: todo
    comment: >-
      binary_sensor.feed_health is device_class PROBLEM. The Quiet mirror and
      the three axis sensors carry none — Quiet has no fitting class, but the
      axis sensors have never been assessed against SensorDeviceClass.ENUM with
      an options list, which is what they are.
  entity-disabled-by-default:
    status: todo
    comment: >-
      Every entity is enabled. The per-source diagnostic sensors are the
      candidates, but they are what an operator board reads to tell a dead feed
      from a zero, so disabling them by default needs a ruling, not a default.
  entity-translations:
    status: todo
    comment: >-
      Entity names are hardcoded _attr_name strings, including the SOURCES
      rows' `name`. translations/en.json covers the config and options flows
      only.
  exception-translations:
    status: exempt
    comment: Raises no exceptions to a user — it registers no actions and never fails setup.
  icon-translations:
    status: todo
    comment: Icons are hardcoded _attr_icon strings rather than icons.json.
  reconfiguration-flow:
    status: todo
    comment: >-
      An options flow exists for scan_interval; there is no reconfigure step.
      With no host or credential to change, the value of one is low.
  repair-issues:
    status: todo
    comment: >-
      Nothing raises a repair. The candidate is a SOURCES row naming an entity
      that does not exist, which is today a WARNING an operator has to find in
      the log — the `_DEFECT_STATES` class that needs a human edit is exactly
      what the repairs surface is for.
  stale-devices:
    status: exempt
    comment: One fixed device, removed with the entry.

  # ---------------------------------------------------------------- Platinum
  async-dependency:
    status: exempt
    comment: No dependency. Every read is against the in-process state machine.
  inject-websession:
    status: exempt
    comment: Makes no HTTP requests.
  strict-typing:
    status: todo
    comment: >-
      Partially typed. The coordinator and resolver carry annotations; both
      platforms' async_setup_entry and the entity constructors do not, and
      there is no py.typed marker or mypy gate.
